name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the failure the drift job catches is not caused by a commit here. The
  # wire specification can move in the application's repository and leave this SDK silently
  # behind, and nobody would push anything for CI to notice.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "20", "22", "24"]
        include:
          # The crypto is portable; path handling and console encodings are not, and the
          # self-check prints text drawn from the vectors — one of which is deliberately
          # non-ASCII. Windows is also where a CRLF checkout would break the pinned digest.
          - os: windows-latest
            node: "20"
          - os: macos-latest
            node: "22"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Self-check the built package
        # Exactly what a user runs after installing. Running it here means a broken checker
        # cannot ship: a self-check that always passes is worse than none, because it turns
        # an unverified installation into one somebody believes is verified.
        run: |
          npm run build
          node dist/conformance-cli.js -v

  other-runtimes:
    # The package claims to run wherever WebCrypto does. A claim nothing exercises is a claim
    # that stops being true without anyone noticing — and the failure mode is a Worker
    # deployment that cannot encrypt, discovered in production.
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read dist/conformance-cli.js -v

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun dist/conformance-cli.js -v

  conformance-drift:
    name: the fixture still matches the published spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Compare the packaged fixture against the published one
        # THE check this job exists for.
        #
        # The application and the four SDKs share no code, deliberately: a package the
        # production application depended on would mean a compromised publish is a
        # compromised application. The cost of that decision is drift, and drift here does
        # not fail a test in normal use — it produces content that can never be decrypted,
        # discovered by a customer when a link does not open.
        #
        # The URL is configuration rather than a constant because the specification lives in
        # a private repository, so this needs a URL the runner can actually reach.
        env:
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL }}
        run: |
          if [ -z "${CREDENSHARE_VECTORS_URL}" ]; then
            # Loud, not silent. A skipped drift check reads as a passing one on the summary
            # page, and this is the single job whose silence is expensive.
            echo "::warning title=Drift detection is NOT running::Set the repository variable CREDENSHARE_VECTORS_URL to a reachable copy of the published vectors.v1.json. Until then nothing verifies that this SDK's fixture matches the specification, and divergence will surface as content that cannot be decrypted."
          fi
          node --import tsx --test test/vectors-integrity.test.ts

  package:
    name: the published tarball carries the fixture verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build

      - name: Install the tarball into a clean directory and self-check it
        # Against the packed artifact, not the working tree. `tsc` re-indents JSON it
        # resolves, so without the copy step the shipped fixture is semantically identical
        # and byte-wise different — and the digest would be pinning a file nobody ships.
        run: |
          TARBALL=$(npm pack --silent)
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node node_modules/@credenshare/sdk/dist/conformance-cli.js -v
          echo "91e70661be51edbc4522d202c533292d1eac92691d1fbb02e9eaa13eb23a582c  node_modules/@credenshare/sdk/dist/conformance-vectors.json" | sha256sum -c -
