name: Release

# Tag-triggered. Nothing here fires on a push to a branch: publishing to npm is
# irreversible — a version can be deprecated but never reused — so it takes the deliberate
# act of tagging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Same opt-in variable CI uses. Without it here, a release is the only build that
      # never checks the fixture against the canonical copy - and it is the one that
      # cannot be taken back.
      - run: npm test
        env:
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL }}
      - run: npm run build
      - run: node dist/conformance-cli.js -v

      - name: The tag must match the version in package.json
        # A mismatch produces a release that says one thing on GitHub and another on npm, and
        # the version is how anyone reports which code they were running.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "releasing $VERSION"

      - name: The tarball must carry the fixture verbatim
        # The last chance to catch the packaging mistake that would ship a reformatted
        # fixture — semantically fine, byte-wise different from the normative artifact, and
        # therefore useless as the thing that holds five implementations together.
        run: |
          echo "91e70661be51edbc4522d202c533292d1eac92691d1fbb02e9eaa13eb23a582c  dist/conformance-vectors.json" | sha256sum -c -

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Trusted Publishing: npm mints a short-lived token for this workflow on this repository,
    # so there is no long-lived automation token in the repository's secrets to leak or
    # rotate. `id-token: write` is what allows the OIDC exchange.
    permissions:
      id-token: write
      contents: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@credenshare/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm's OIDC trusted publishing requires npm >= 11.5.1. Node 22 bundles npm 10.9.8,
      # so without this the CLI doing the publish does not support the OIDC exchange at
      # all - and it fails looking like a credentials problem rather than a version one.
      # Upgraded HERE only: the test matrix stays on what Node ships, because that is what
      # consumers actually run.
      - run: npm install -g npm@^11.5.1
      - run: npm --version
      - run: npm ci && npm run build
      # Works either way. npm's OIDC trusted publishing needs no secret, but it generally
      # wants the package to EXIST before a publisher can be configured for it - and this
      # package does not exist yet. So if NPM_TOKEN is present it is used (which is what a
      # first publish needs), and if it is absent the OIDC path runs. Once the package exists
      # and a trusted publisher is configured, delete the secret and this falls back to OIDC
      # with no other change.
      - run: npm publish --provenance --access public
        if: vars.PUBLISH_TO_REGISTRY == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Registry publication is not switched on
        if: vars.PUBLISH_TO_REGISTRY != 'true'
        run: |
          echo "::notice title=Not published to the registry::This release was verified and \
          tagged, but PUBLISH_TO_REGISTRY is not 'true' so nothing was uploaded. Configure the \
          registry credential for this repository, then set the repository variable \
          PUBLISH_TO_REGISTRY=true. See VERSIONING.md."

      # A GitHub Release is the durable, registry-independent artifact: it exists whether or
      # not PUBLISH_TO_REGISTRY is on, so a tag always produces something a consumer can
      # point at and something this repository can be verified against later.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --title "$GITHUB_REF_NAME"             --notes "Install:

          \`\`\`
          npm install github:CredenShare/credenshare-sdk-node#$GITHUB_REF_NAME
          \`\`\`

          Verify the install against the wire specification:

          \`\`\`
          npx credenshare-conformance
          \`\`\`

          See CHANGELOG.md for what changed.

          Not on npm yet - see VERSIONING.md."
